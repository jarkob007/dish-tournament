<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Турнир блюд</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e1e2f 0%, #2d2d44 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    margin-bottom: 10px;
    font-size: 2rem;
    text-align: center;
    background: linear-gradient(90deg, #ffd166, #ef476f);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #round-info {
    margin-bottom: 20px;
    font-size: 1.1rem;
    color: #a0a0c0;
  }
  #arena {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    margin: 20px 0;
  }
  .dish {
    background: #2d2d44;
    border: 3px solid #444;
    border-radius: 20px;
    padding: 40px 50px;
    font-size: 1.4rem;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    min-width: 220px;
    max-width: 320px;
    user-select: none;
  }
  .dish:hover {
    border-color: #ffd166;
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(255, 209, 102, 0.3);
  }
  .vs {
    font-size: 2rem;
    font-weight: bold;
    color: #ef476f;
  }
  #winner {
    text-align: center;
    display: none;
    width: 100%;
    max-width: 1200px;
  }
  #winner h2 {
    font-size: 2rem;
    margin-bottom: 20px;
  }
  #winner .champion {
    font-size: 2.2rem;
    padding: 30px 50px;
    background: linear-gradient(135deg, #ffd166, #ef476f);
    border-radius: 25px;
    display: inline-block;
    margin-bottom: 40px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  button {
    background: #ffd166;
    color: #1e1e2f;
    border: none;
    padding: 15px 30px;
    font-size: 1.1rem;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
    margin-top: 30px;
  }
  button:hover { background: #ffb703; }

  /* Турнирная сетка */
  .bracket {
    display: flex;
    gap: 30px;
    overflow-x: auto;
    padding: 20px 10px;
    justify-content: flex-start;
    align-items: stretch;
    width: 100%;
  }
  .bracket-round {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    gap: 10px;
    min-width: 200px;
  }
  .bracket-round-title {
    text-align: center;
    font-size: 0.9rem;
    color: #a0a0c0;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .match {
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: #252538;
    border-radius: 12px;
    padding: 8px;
    border: 1px solid #3a3a55;
  }
  .match-item {
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    background: #2d2d44;
    color: #cfcfe0;
    transition: 0.2s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .match-item.win {
    background: linear-gradient(90deg, #2d6a4f, #40916c);
    color: #fff;
    font-weight: bold;
  }
  .match-item.lose {
    text-decoration: line-through;
    opacity: 0.45;
    color: #888;
  }
  .match-item.champion {
    background: linear-gradient(90deg, #ffd166, #ef476f);
    color: #1e1e2f;
    font-weight: bold;
    box-shadow: 0 0 15px rgba(255, 209, 102, 0.5);
  }

  @media (max-width: 700px) {
    .dish { padding: 25px 30px; font-size: 1.1rem; min-width: 150px; }
    .vs { font-size: 1.4rem; }
    #arena { gap: 15px; }
    .bracket-round { min-width: 150px; }
    .match-item { font-size: 0.8rem; padding: 6px 8px; }
  }
</style>
</head>
<body>

<h1>🏆 Турнир блюд</h1>
<div id="round-info"></div>

<div id="game">
  <div id="arena"></div>
</div>

<div id="winner">
  <h2>Победитель!</h2>
  <div class="champion" id="champion-name"></div>

  <h3 style="margin-bottom: 10px; color: #a0a0c0;">Полная турнирная сетка</h3>
  <div class="bracket" id="bracket"></div>

  <button onclick="restart()">Играть снова</button>
</div>

<script>
// Список блюд — популярные у молодёжи в России + солёное
const initialDishes = [
  'Шаурма',
  'Пицца',
  'Бургер',
  'Суши-роллы',
  'Доширак',
  'Наггетсы',
  'Картошка фри',
  'Шашлык',
  'Хинкали',
  'Пельмени',
  'Блины',
  'Сырники',
  'Селёдка под шубой',
  'Солёные огурцы',
  'Солёные грузди',
  'Квашеная капуста'
];

let rounds = [];      // текущий раунд: массив блюд
let nextRound = [];   // победители текущего раунда
let currentPair = 0;  // индекс текущей пары
let roundNumber = 1;

// История турнира: массив раундов, каждый раунд — массив матчей
// матч = { a: 'блюдо', b: 'блюдо', winner: 'блюдо' }
let bracketHistory = [];

const arena = document.getElementById('arena');
const roundInfo = document.getElementById('round-info');
const gameDiv = document.getElementById('game');
const winnerDiv = document.getElementById('winner');
const championName = document.getElementById('champion-name');
const bracketDiv = document.getElementById('bracket');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  rounds = shuffle(initialDishes);
  nextRound = [];
  currentPair = 0;
  roundNumber = 1;
  bracketHistory = [];
  winnerDiv.style.display = 'none';
  gameDiv.style.display = 'block';
  renderPair();
}

function renderPair() {
  // Если в текущем раунде закончились пары
  if (currentPair >= rounds.length) {
    if (nextRound.length === 1) {
      // Победитель
      gameDiv.style.display = 'none';
      winnerDiv.style.display = 'block';
      championName.textContent = nextRound[0];
      renderBracket();
      return;
    }
    // Переход к следующему раунду
    rounds = nextRound;
    nextRound = [];
    currentPair = 0;
    roundNumber++;
  }

  const a = rounds[currentPair];
  const b = rounds[currentPair + 1];

  roundInfo.textContent = `Раунд ${roundNumber} • Пар: ${Math.floor(rounds.length / 2)}`;

  arena.innerHTML = `
    <div class="dish" data-choice="0">${a}</div>
    <div class="vs">VS</div>
    <div class="dish" data-choice="1">${b}</div>
  `;

  arena.querySelectorAll('.dish').forEach(el => {
    el.addEventListener('click', () => {
      const choice = parseInt(el.dataset.choice);
      const winner = choice === 0 ? a : b;
      const loser = choice === 0 ? b : a;

      // Записываем матч в историю
      const matchIndex = Math.floor(currentPair / 2);
      if (!bracketHistory[roundNumber - 1]) {
        bracketHistory[roundNumber - 1] = [];
      }
      bracketHistory[roundNumber - 1][matchIndex] = { a, b, winner };

      nextRound.push(winner);
      currentPair += 2;
      renderPair();
    });
  });
}

function getRoundName(roundIdx, totalRounds) {
  const remaining = totalRounds - roundIdx; // сколько раундов осталось включая текущий
  if (remaining === 1) return 'Финал';
  if (remaining === 2) return 'Полуфинал';
  if (remaining === 3) return '1/4 финала';
  if (remaining === 4) return '1/8 финала';
  if (remaining === 5) return '1/16 финала';
  return `Раунд ${roundIdx + 1}`;
}

function renderBracket() {
  const totalRounds = bracketHistory.length;
  const champion = nextRound[0];

  let html = '';
  for (let r = 0; r < totalRounds; r++) {
    const matches = bracketHistory[r] || [];
    const isFinalRound = r === totalRounds - 1;

    html += `<div class="bracket-round">`;
    html += `<div class="bracket-round-title">${getRoundName(r, totalRounds)}</div>`;

    matches.forEach(match => {
      if (!match) return;
      const aClass = match.winner === match.a ? 'win' : 'lose';
      const bClass = match.winner === match.b ? 'win' : 'lose';

      // В финале победителя помечаем как чемпиона
      const aFinal = isFinalRound && match.winner === match.a ? ' champion' : '';
      const bFinal = isFinalRound && match.winner === match.b ? ' champion' : '';

      html += `
        <div class="match">
          <div class="match-item ${aClass}${aFinal}">${match.a}</div>
          <div class="match-item ${bClass}${bFinal}">${match.b}</div>
        </div>
      `;
    });

    html += `</div>`;
  }

  bracketDiv.innerHTML = html;
}

function restart() {
  startGame();
}

startGame();
</script>

</body>
</html>
